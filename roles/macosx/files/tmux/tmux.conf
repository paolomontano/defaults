# Start indexing at 1
set -g base-index 1
set -g pane-base-index 1

# Keep numbering contiguous when windows close
set -g renumber-windows on

# Max practical scrollback
set -g history-limit 1000000

# Reduce Escape delay for Vim/Neovim and copy mode
set -sg escape-time 10

# Vi-style copy mode
setw -g mode-keys vi

# Prefix key
set -g prefix C-b
unbind C-b
bind C-b send-prefix

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB"
set -ga terminal-features ",screen-256color:RGB"
set -ga terminal-features ",tmux-256color:RGB"

# Resize active client aggressively in multi-client sessions
setw -g aggressive-resize on

# Key bindings
bind m set -g mouse on \; display-message "Mouse: ON"
bind M set -g mouse off \; display-message "Mouse: OFF"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind [ copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send -X rectangle-toggle

# Pane navigation (no prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane resize (no prefix)
bind -nr M-H resize-pane -L 5
bind -nr M-J resize-pane -D 5
bind -nr M-K resize-pane -U 5
bind -nr M-L resize-pane -R 5

# Catppuccin tmux (via TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_window_status_style "rounded"

# Alacritty-driven Catppuccin flavor
if-shell -F '#{==:#{ALACRITTY_STARSHIP_THEME},mocha}' \
  'set -g @catppuccin_flavor "mocha"' \
  'if-shell -F "#{==:#{ALACRITTY_STARSHIP_THEME},dark}" \
    "set -g @catppuccin_flavor \"mocha\"" \
    "set -g @catppuccin_flavor \"latte\""'

# Status bar
set -g status on
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

run '~/.config/tmux/plugins/tpm/tpm'
